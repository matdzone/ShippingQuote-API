scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Registered user has expected fields\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    pm.expect(body).to.have.property(\"id\");\r

      \    pm.expect(body.email).to.eql(\"customer@test.lt\");\r

      \    pm.expect(body.role).to.eql(\"Customer\");\r

      \    pm.expect(body).to.have.property(\"createdAt\");\r

      });"
