$kind: http-request
name: Get hierarchical pricing rules
url: "{{baseUrl}}/api/carriers/1/services/1/pricing-rules"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returns pricing rules for the requested service\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    pm.expect(body).to.be.an(\"array\");\r

      \r

      \    body.forEach(rule => {\r

      \        pm.expect(rule.deliveryServiceId).to.eql(1);\r

      \    });\r

      });"
    language: text/javascript
