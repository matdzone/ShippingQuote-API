$kind: http-request
description: ""
url: "{{baseUrl}}/api/carriers/{{testCarrierId}}"
method: GET
scripts:
  - type: afterResponse
    code: "// Get carrier by id\r

      pm.test(\"Carrier contains hypermedia links\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    pm.expect(body._links).to.be.an(\"array\");\r

      \    pm.expect(body._links.length).to.be.above(0);\r

      \r

      \    const relations = body._links.map(link => link.rel);\r

      \r

      \    pm.expect(relations).to.include(\"self\");\r

      \    pm.expect(relations).to.include(\"update\");\r

      \    pm.expect(relations).to.include(\"delete\");\r

      });"
    language: text/javascript
