$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
body:
  type: json
  content: "{\r

    \  \"refreshToken\": \"{{refreshToken}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const body = pm.response.json();\r

      \r

      pm.collectionVariables.set(\r

      \    \"accessToken\",\r

      \    body.accessToken\r

      );\r

      \r

      pm.collectionVariables.set(\r

      \    \"refreshToken\",\r

      \    body.refreshToken\r

      );"
    language: text/javascript
order: 4503599627375475
