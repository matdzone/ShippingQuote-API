$kind: http-request
url: "{{baseUrl}}/api/carriers?isActive=true"
method: GET
queryParams:
  isActive: "true"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Returned carriers are active\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.items.forEach(carrier => {\r

      \        pm.expect(carrier.isActive).to.eql(true);\r

      \    });\r

      });"
    language: text/javascript
order: 4503599627369939
